<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سلة التسوق - K✧M Store</title>
  <style>
    body {
      background-color: #0d0d11;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      margin: 0;
      box-sizing: border-box;
    }
    .section-title {
      font-size: 1.5rem;
      color: #ffc700;
      margin-bottom: 20px;
      border-right: 4px solid #ff5e00;
      padding-right: 10px;
    }
    .cart-items {
      display: grid;
      gap: 15px;
      margin-bottom: 30px;
    }
    .cart-item {
      background-color: #1a1a24;
      border: 1px solid #2a2a3a;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .item-info h3 {
      font-size: 1.1rem;
      margin: 0 0 5px 0;
    }
    .item-info .price {
      color: #ffc700;
      font-weight: bold;
      margin: 0;
    }
    .remove-btn {
      background-color: #ff3333;
      color: #ffffff;
      border: none;
      padding: 8px 15px;
      border-radius: 8px;
      cursor: pointer;
    }
    .total-section {
      background-color: #15151e;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      font-size: 1.2rem;
    }
    .total-price {
      color: #ffc700;
      font-weight: bold;
    }
    .checkout-btn {
      background-color: #ff5e00;
      color: #ffffff;
      border: none;
      padding: 15px 30px;
      border-radius: 8px;
      font-weight: bold;
      width: 100%;
      margin-top: 15px;
      cursor: pointer;
      font-size: 1rem;
    }

    /* === ستايل الـ Modal المحدث === */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      backdrop-filter: blur(5px);
      padding: 15px;
      box-sizing: border-box;
    }
    .modal-content {
      background-color: #1a1a24;
      border: 2px solid #ff5e00;
      border-radius: 16px;
      padding: 20px;
      text-align: right;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(255, 94, 0, 0.3);
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px solid #2a2a3a;
      padding-bottom: 10px;
    }
    .modal-header h3 {
      margin: 0;
      color: #ffc700;
      font-size: 1.2rem;
    }
    .close-btn {
      color: #aaaaaa;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
    }
    .close-btn:hover {
      color: #ffffff;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.9rem;
      color: #dddddd;
    }
    .required {
      color: #ff3333;
    }
    .form-group input, .form-group textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #2a2a3a;
      background-color: #0d0d11;
      color: #ffffff;
      box-sizing: border-box;
      font-size: 0.95rem;
      font-family: inherit;
    }
    .form-group input:focus, .form-group textarea:focus {
      outline: none;
      border-color: #ff5e00;
    }
    .modal-submit-btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      background-color: #25d366;
      color: #ffffff;
      font-size: 1rem;
      margin-top: 10px;
      transition: 0.3s;
    }
    .modal-submit-btn:hover {
      background-color: #1ebc57;
    }
  </style>
</head>
<body>

  <h2 class="section-title">سلة التسوق</h2>
  
  <div class="cart-items" id="cartItems">
    <!-- المنتجات هتظهر هنا -->
  </div>

  <div class="total-section">
    الإجمالي: <span class="total-price" id="totalPrice">0 جنيه</span>
    <button class="checkout-btn" onclick="checkout()">إتمام الطلب</button>
  </div>

  <!-- النافذة المنبثقة (Modal) لاستكمال البيانات -->
  <div class="modal-overlay" id="checkoutModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>بيانات الشحن المطلوبة</h3>
        <span class="close-btn" onclick="closeModal()">&times;</span>
      </div>
      <form id="checkoutForm" onsubmit="handleCheckoutSubmit(event)">
        
        <div class="form-group">
          <label for="playerId">معرف اللاعب (ID) <span class="required">*</span></label>
          <input type="text" id="playerId" placeholder="أدخل ID الحساب" required />
        </div>

        <div class="form-group">
          <label for="accountName">اسم الحساب في اللعبة (اختياري)</label>
          <input type="text" id="accountName" placeholder="أدخل اسم الحساب" />
        </div>

        <div class="form-group">
          <label for="clientPhone">رقم هاتف العميل <span class="required">*</span></label>
          <input type="tel" id="clientPhone" placeholder="01xxxxxxxx" required />
        </div>

        <div class="form-group">
          <label for="orderNote">ملحوظة إضافية (اختياري)</label>
          <textarea id="orderNote" rows="2" placeholder="أي ملاحظات إضافية"></textarea>
        </div>

        <button type="submit" class="modal-submit-btn">متابعة للشحن عبر WhatsApp 📲</button>
      </form>
    </div>
  </div>

  <script>
    let cart = JSON.parse(localStorage.getItem('cart')) || [];

    function renderCart() {
      const cartItemsContainer = document.getElementById('cartItems');
      const totalPriceContainer = document.getElementById('totalPrice');
      cartItemsContainer.innerHTML = '';
      let total = 0;

      if (cart.length === 0) {
        cartItemsContainer.innerHTML = '<p>العربة فارغة حالياً.</p>';
        totalPriceContainer.innerText = '0 جنيه';
        return;
      }

      cart.forEach((item, index) => {
        total += item.price;
        const itemElement = document.createElement('div');
        itemElement.className = 'cart-item';
        itemElement.innerHTML = `
          <div class="item-info">
            <h3>${item.name}</h3>
            <p class="price">${item.price} جنيه</p>
          </div>
          <button class="remove-btn" onclick="removeItem(${index})">حذف</button>
        `;
        cartItemsContainer.appendChild(itemElement);
      });

      totalPriceContainer.innerText = total + ' جنيه';
    }

    function removeItem(index) {
      cart.splice(index, 1);
      localStorage.setItem('cart', JSON.stringify(cart));
      renderCart();
    }

    function checkout() {
      if (cart.length === 0) {
        alert('العربة فارغة!');
        return;
      }
      document.getElementById('checkoutModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('checkoutModal').style.display = 'none';
    }

    function handleCheckoutSubmit(event) {
      event.preventDefault();

      const storeWhatsAppNumber = "2001097368701"; // رقم الواتساب الخاص بالمتجر

      // تجميع أسماء الباقات وإجمالي السعر
      const packagesList = cart.map(item => item.name).join(' + ');
      let totalPrice = 0;
      cart.forEach(item => totalPrice += item.price);

      // جلب اسم اللعبة إذا كان محدد في السلة أو وضع لعبة افتراضية
      const gameName = cart[0].game || 'ببجي موبايل';

      // قراءة البيانات من المدخلات
      const playerId = document.getElementById('playerId').value.trim();
      const accountName = document.getElementById('accountName').value.trim() || 'غير مدخل';
      const phone = document.getElementById('clientPhone').value.trim();
      const note = document.getElementById('orderNote').value.trim() || 'لا يوجد';

      // صياغة الرسالة المنسقة
      const message = `مرحباً متجر K&M TopUp 👋
أريد تأكيد طلب شحن جديد:
━━━━━━━━━━━━━━━━
🎮 اللعبة: ${gameName}
📦 الباقة: ${packagesList}
💰 المبلغ المطلوب: ${totalPrice} جنيه
🆔 معرف اللاعب (ID): ${playerId}
👤 اسم الحساب: ${accountName}
📱 رقم هاتف العميل: ${phone}
📝 ملحوظة: ${note}
━━━━━━━━━━━━━━━━
💳 وسيلة الدفع الأولى: إنستاباي (InstaPay) إلى الرقم 01122511179
💳 وسيلة الدفع الثانية: محفظة إلكترونية إلى الرقم 01097368701
━━━━━━━━━━━━━━━━
⚠️ تنبيه وتحذير هام:
لن يتم شحن الحساب إلا بعد دفع المبلغ بالكامل وتحويل وإرسال صورة/لقطة شاشة (إيصال التحويل) في هذه المحادثة.
(سأقوم بإرسال صورة التحويل الآن مع هذه الرسالة 📸)
━━━━━━━━━━━━━━━━
يرجى تأكيد الاستلام وتنفيذ الشحن، شكراً لكم!`;

      // فتح الواتساب وتنظيف السلة
      const encodedMessage = encodeURIComponent(message);
      const whatsappUrl = `https://wa.me/${storeWhatsAppNumber}?text=${encodedMessage}`;

      closeModal();
      
      // تفريغ السلة بعد إتمام الطلب
      localStorage.removeItem('cart');
      cart = [];
      renderCart();

      // التحويل للواتساب
      window.location.href = whatsappUrl;
    }

    renderCart();
  </script>

</body>
</html>
